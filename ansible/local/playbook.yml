---
# ============================================================================
# SeyoAWE Engine — Local Kubernetes Configuration Playbook
#
# Prereqs:
#   - Terraform has provisioned: namespace, configmap (engine-config),
#     secret (engine-secrets)
#   - A kubeconfig with the target context exists
#   - kubectl is on PATH
#
# What this playbook does:
#   1. Verify the cluster is reachable
#   2. Verify the namespace exists (Terraform should have created it)
#   3. Apply the engine K8s manifests (StatefulSet + Service) into the ns
#   4. Wait for the engine pod to be Ready
#   5. Verify the Service exists and print access info
# ============================================================================

- name: Configure and validate SeyoAWE engine on local Kubernetes
  hosts: local_k8s
  gather_facts: false

  vars:
    namespace: "{{ lookup('env', 'SEYOAWE_NAMESPACE') | default('seyoawe', true) }}"
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(ansible_env.HOME ~ '/.kube/config', true) }}"
    k8s_manifest_dir: "../../k8s"
    engine_service: "seyoawe-engine"
    engine_port: 8080
    pod_label_selector: "app=seyoawe-engine"
    wait_timeout_seconds: 180

  tasks:

    # --------------------------------------------------------------------
    # Preflight
    # --------------------------------------------------------------------

    - name: Preflight - verify kubectl can reach the cluster
      command: kubectl --kubeconfig={{ kubeconfig }} cluster-info
      register: cluster_info
      changed_when: false
      failed_when: cluster_info.rc != 0

    - name: Preflight - verify namespace exists (created by Terraform)
      command: kubectl --kubeconfig={{ kubeconfig }} get namespace {{ namespace }}
      register: ns_check
      changed_when: false
      failed_when: ns_check.rc != 0

    - name: Preflight - verify engine-config ConfigMap exists
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        get configmap engine-config -n {{ namespace }}
      register: cm_check
      changed_when: false
      failed_when: cm_check.rc != 0

    - name: Preflight - verify engine-secrets Secret exists
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        get secret engine-secrets -n {{ namespace }}
      register: secret_check
      changed_when: false
      failed_when: secret_check.rc != 0

    # --------------------------------------------------------------------
    # Apply manifests
    # --------------------------------------------------------------------

    - name: Apply engine Kubernetes manifests (StatefulSet + Service)
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        apply -n {{ namespace }}
        -f {{ k8s_manifest_dir }}/engine-service.yaml
        -f {{ k8s_manifest_dir }}/engine-statefulset.yaml
      register: kubectl_apply
      changed_when: "'configured' in kubectl_apply.stdout or 'created' in kubectl_apply.stdout"

    - name: Show kubectl apply output
      debug:
        var: kubectl_apply.stdout_lines

    # --------------------------------------------------------------------
    # Wait for pod
    # --------------------------------------------------------------------

    - name: Wait for engine pod to be Ready
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        wait --for=condition=Ready pod
        -l {{ pod_label_selector }}
        -n {{ namespace }}
        --timeout={{ wait_timeout_seconds }}s
      register: wait_result
      changed_when: false

    - name: Show pod status
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        get pods -n {{ namespace }} -o wide
      register: pod_status
      changed_when: false

    - name: Display pod status
      debug:
        var: pod_status.stdout_lines

    # --------------------------------------------------------------------
    # Verify service
    # --------------------------------------------------------------------

    - name: Verify engine Service exists
      command: >
        kubectl --kubeconfig={{ kubeconfig }}
        get service {{ engine_service }} -n {{ namespace }}
      register: svc_check
      changed_when: false
      failed_when: svc_check.rc != 0

    - name: Display service info
      debug:
        var: svc_check.stdout_lines

    # --------------------------------------------------------------------
    # Summary
    # --------------------------------------------------------------------

    - name: Deployment summary
      debug:
        msg:
          - "SeyoAWE engine deployed successfully"
          - "Namespace: {{ namespace }}"
          - "Service:   {{ engine_service }}:{{ engine_port }}"
          - "Port-forward: kubectl -n {{ namespace }} port-forward svc/{{ engine_service }} {{ engine_port }}:{{ engine_port }}"
