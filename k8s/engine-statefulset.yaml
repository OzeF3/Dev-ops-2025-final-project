apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seyoawe-engine
  labels:
    app: seyoawe-engine
spec:
  serviceName: "seyoawe-engine"
  replicas: 1
  selector:
    matchLabels:
      app: seyoawe-engine
  template:
    metadata:
      labels:
        app: seyoawe-engine
    spec:
      containers:
        - name: seyoawe-engine
          image: devoeoe23ops/seyoawe-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # --- Health probes ---
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # --- Non-sensitive config from Terraform-managed ConfigMap ---
          envFrom:
            - configMapRef:
                name: engine-config
          # --- Sensitive credentials from Terraform-managed Secret ---
          env:
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: engine-secrets
                  key: GMAIL_USER
            - name: GMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engine-secrets
                  key: GMAIL_PASSWORD
            - name: JIRA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: engine-secrets
                  key: JIRA_EMAIL
            - name: JIRA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: engine-secrets
                  key: JIRA_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: engine-secrets
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: engine-storage
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: engine-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
