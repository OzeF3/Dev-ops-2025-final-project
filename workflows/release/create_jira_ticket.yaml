id: create_jira_ticket_workflow
name: "Create Jira Ticket"
description: "Creates a Jira issue in the Seyoawe DevOps project via API"

trigger:
  type: api

steps:
  - id: create_jira_issue
    type: api
    config:
      method: POST
      url: "https://oefraty.atlassian.net/rest/api/3/issue"
      headers:
        Content-Type: "application/json"
        Authorization: "Basic {{ secrets.jira_basic_auth }}"
      payload:
        fields:
          project:
            key: "SEY"
          summary: "{{ context.trigger.payload.summary }}"
          description:
            type: "doc"
            version: 1
            content:
              - type: "paragraph"
                content:
                  - type: "text"
                    text: "{{ context.trigger.payload.description }}"
          issuetype:
            name: "{{ context.trigger.payload.issue_type }}"
