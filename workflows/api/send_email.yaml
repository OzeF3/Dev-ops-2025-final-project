workflow:
  name: send_email
  trigger:
    type: api
  context_variables:
    - name: to
      type: string
      default: "oefraty@gmail.com"
    - name: subject
      type: string
      default: "Message from Seyoawe"
    - name: body
      type: string
      default: "Hello from the engine!"
  steps:
    - id: send_email
      type: action
      action: email_module.Email.send_email
      input:
        to: "{{ context.to }}"
        subject: "{{ context.subject }}"
        body: "{{ context.body }}"
