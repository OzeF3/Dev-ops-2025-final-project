workflow:
  name: send_email
  trigger:
    type: ad-hoc
  steps:
    - id: send_email
      type: action
      action: email_module.Email.send_email
      input:
        to: "{{ context.trigger.payload.to }}"
        subject: "{{ context.trigger.payload.subject }}"
        body: "{{ context.trigger.payload.body }}"
